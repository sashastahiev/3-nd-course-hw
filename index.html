<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .activeLike{
        background-image: url("image/Like-Activ.svg");
      }
    </style>
  </head>
  <body>
    <section id="container" class="container">
      <ul id="comments" class="comments">
        <!-- Комментарии -->
        <p>Пожалуйста подождите, идет загрузка комментариев...<p>
      </ul>
      <div id="form-add-comment" class="add-form">
        <input 
          id="name-user"
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          id="text-comment"
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button id="addComment" class="add-form-button">Написать</button>
        </div>
      </div>
      <section id="regis" class="add-form">
        <h1 class="add-form-regis-title">Регистрация</h1>
        <div class="add-form-inputs">
          <input
          type="text"
          class="add-form-name"
          placeholder="Введите имя"
          id="nameRegis"
          required>
          <input
          type="text"
          class="add-form-name"
          placeholder="Введите логин"
          id="loginRegis"
          required>
          <input
          type="text"
          class="add-form-name"
          placeholder="Введите пароль"
          id="passwordRegis"
          required>
        </div>
        <fieldset class="add-form-registry">
          <button class="add-form-button">Зарегистрироваться</button>
        </fieldset>
      </section>
      <section id="authorization" class="add-form">
        <h1 class="add-form-auth-title">Авторизация</h1>
        <div class="add-form-inputs">
          <input
          type="text"
          class="add-form-name"
          placeholder="Введите логин"
          id="loginAuth"
          required>
          <input
          type="text"
          class="add-form-name"
          placeholder="Введите пароль"
          id="passwordAuth"
          required>
        </div>
        <fieldset class="add-form-registry">
          <button class="add-form-button">Войти</button>
          <u class="add-form-button-link entry">
            Зарегистрироваться
          </u>
        </fieldset>
      </section>
      <p id="alert-auth">чтобы отправить комментарий, <u class="login-link">войдите</u></p>
    </section>
  </body>
  <script type="module" src="./index.js"></script>
</html>
